name: "ll_project"
type: "python:3.10"

relationships:
    database: "db:postgresql"

# A configuração da aplicação quando exporta na web
web:
    upstream:
        socket_family: unix
    commands:
        start: "gunicorn -w 4 -b unix:$SOCKET ll_project.wsgi:application"
    locations:
        "/":
            passthru: true
        "/static":
            root: "static"
            expires: 1h
            allow: true

# O tamanho do disco permanente da aplicação (em MB)
disk: 512

# Define mounts de leitura/gravação local
mounts:
    "logs":
        source: local
        source_path: logs

# Os hooks executados em vários pontos do ciclo de vida da aplicação
hooks:
    build: |
        pip install --upgrade pip
        pip install -r requirements.txt
        mkdir logs
        python manage.py collectstatic
        rm -rf logs
    deploy: |
        python manage.py migrate