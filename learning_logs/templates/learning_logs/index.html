{% extends "learning_logs/base.html" %}

{% block content %}

  <div class="p-5 mb-4 bg-light rounded-3">
    <div class="container-fluid py-5">
      <h1 class="display-5 fw-bold">Learning Log</h1>
      <p class="col-md-8 fs-4">
        Learning Log ajuda você a acompanhar seus estudos sobre qualquer tópico que estiver aprendendo.
      </p>
      {% if not user.is_authenticated %}
        <a class="btn btn-primary btn-lg" href="{% url 'users:register' %}" role="button">Comece agora</a>
      {% endif %}
    </div>
  </div>

{% endblock content %}
