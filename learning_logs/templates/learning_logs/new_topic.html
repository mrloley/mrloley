{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}

{% block content %}

  <h2>Adicionar novo tópico:</h2>

  <form method='post' action="{% url 'learning_logs:new_topic' %}">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button "Adicionar tópico" button_type="submit" button_class="btn-primary" %}
  </form>

{% endblock content %}
