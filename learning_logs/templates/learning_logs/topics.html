{% extends "learning_logs/base.html" %}

{% block content %}

  <p><a href="{% url 'learning_logs:new_topic' %}" class="btn btn-primary">Adicionar novo tópico</a></p>

  <ul class="list-group">
    {% for topic in topics %}
      <li class="list-group-item">
        <a href="{% url 'learning_logs:topic' topic.id %}">{{ topic.text }}</a>
      </li>
    {% empty %}
      <li class="list-group-item">Nenhum tópico foi adicionado ainda.</li>
    {% endfor %}
  </ul>

{% endblock content %}
